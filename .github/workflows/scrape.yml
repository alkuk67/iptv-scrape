name: IPTV Scrape

on:
  schedule:
    # UTC 19:00 = Beijing 03:00
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run scraper (skip probe, no UDP reachability on GitHub)
        run: python src/scrape_multicast.py --skip-probe

      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iptv-data
          path: |
            data/multicast_sources_filtered.json
            data/channels_all.json
            data/scraper.log
          retention-days: 7
